<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierre Marcou — Mes Liens</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        img.avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            margin-bottom: 15px;
            object-fit: cover;
        }
        a.link-button {
            display: block;
            background-color: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid #334155;
            font-weight: 600;
            transition: background 0.2s;
        }
        a.link-button:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
        /* Bloc de logos institutionnels */
        .logos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
        }
        .logos a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .logos img {
            height: 38px;
            width: auto;
            object-fit: contain;
        }
        .logos img.nivose {
            height: 48px;
            border-radius: 50%;
        }
        /* Ligne des affiliations */
        .affiliations {
            font-size: 0.9em;
            line-height: 1.5;
            opacity: 0.9;
        }
        .affiliations a {
            color: #38bdf8;
            text-decoration: none;
        }
        .affiliations a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="avatar.jpg" alt="Avatar" class="avatar">
        <h1>Pierre Marcou</h1>
        <p class="affiliations">
            Doctorant — Université de Lorraine (LOTERR)<br>
            <a href="https://www.uliege.be/" target="_blank" rel="noopener">Université de Liège</a> — Laboratoire de Climatologie et Topoclimatologie<br>
            Membre de <a href="https://nivose-vosges.org/" target="_blank" rel="noopener">Niv'OSE</a>
        </p>

        <!-- Logos institutionnels -->
        <div class="logos">
            <a href="https://www.univ-lorraine.fr/" target="_blank" rel="noopener" title="Université de Lorraine">
                <img src="logo-ul.jpg" alt="Université de Lorraine">
            </a>
            <a href="https://loterr.univ-lorraine.fr/" target="_blank" rel="noopener" title="LOTERR">
                <img src="logo-loterr.jpg" alt="LOTERR">
            </a>
            <a href="https://www.uliege.be/" target="_blank" rel="noopener" title="Université de Liège">
                <img src="logo-uliege.jpg" alt="Université de Liège">
            </a>
            <a href="https://nivose-vosges.org/" target="_blank" rel="noopener" title="Niv'OSE">
                <img src="logo-nivose.jpg" alt="Niv'OSE" class="nivose">
            </a>
        </div>

        <a href="https://www.linkedin.com/in/pierre-marcou-a17483255/" class="link-button" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://loterr.univ-lorraine.fr/doctorant/marcou-pierre/" class="link-button" target="_blank" rel="noopener">LOTERR — Université de Lorraine</a>
        <a href="https://nivose-vosges.org/" class="link-button" target="_blank" rel="noopener">🖼️ Niv'OSE — Site officiel</a>
        <a href="mailto:pierre.marcou@univ-lorraine.fr" class="link-button">M'envoyer un e-mail</a>
    </div>
</body>
</html>
